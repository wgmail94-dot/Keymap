name: Android CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # diperlukan untuk membuat GitHub Release saat tag v*

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Proyek tidak punya gradlew, jadi Gradle dipasang langsung.
      # AGP 8.6.1 butuh Gradle minimal 8.7.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TapBridge-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TapBridge-debug-${{ github.sha }}
          path: TapBridge-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TapBridge-debug.apk
          generate_release_notes: true
